name: Clean up posted reels
# reels/schedule.json maps each file in reels/ to its post time (UTC). Files are deleted 3 h after that time,
# so Instagram has fetched them and the Pages site stays small. Files without an entry are never touched.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete reels whose post time has passed
        run: |
          python3 - <<'PY'
          import json, os, datetime
          now = datetime.datetime.now(datetime.timezone.utc); old = lambda t: datetime.datetime.fromisoformat(
              t.replace('Z', '+00:00')) + datetime.timedelta(hours=3) < now
          def drop(f):
              if os.path.exists(f'reels/{f}'): os.remove(f'reels/{f}'); print('deleted', f)
          # queue.json: delete a reel 3 h after it actually went live, not after its planned slot -
          # a post that ran late must still find its file on the Pages site.
          q = 'reels/queue.json'; Q = json.load(open(q)) if os.path.exists(q) else []
          for e in Q:
              if e.get('posted_at') and old(e['posted_at']): drop(e['file'])
          json.dump([e for e in Q if not (e.get('posted_at') and old(e['posted_at']))], open(q, 'w'),
                    ensure_ascii=False, indent=1)
          # schedule.json: the old mechanism, kept for files queued before the switch.
          p = 'reels/schedule.json'; S = json.load(open(p)) if os.path.exists(p) else {}
          keep = {}
          for f, t in S.items():
              if old(t): drop(f)
              else: keep[f] = t
          json.dump(keep, open(p, 'w'), indent=1)
          PY
          git config user.name "cleanup-bot"; git config user.email "cleanup-bot@users.noreply.github.com"
          git add -A reels; git commit -qm "Remove posted reels" && git push -q || echo "nothing to clean"
